<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <title>Postlab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <h1>PostLab</h1>
        <button id="botao-recarregar" type="button">Recarregar dados</button>
    </header>
    <main>
        <input id="campo-busca" type="search" placeholder="Buscar pelo título" />
        <select id="filtro-usuario">
            <option value="">Todos os autores</option>
        </select>
        <p id="contador-posts" aria-live="polite"></p>
        <div id="estado-interface" role="status" aria-live="polite"></div>
        <div id="lista-posts"></div>

        <script src="app.js"></script>
</body>

</html>
